# PostgreSQL Configuration Template (module: github.com/wordgate/qtoolkit/pg)
# Add this to your main config.yml file

pg:
  # Connection string (required). URL or key=value form, as accepted by pgx.
  dsn: "postgres://user:password@localhost:5432/dbname?sslmode=disable"

  # Pool tuning (all optional). An omitted field keeps the value from the DSN
  # (pool_max_conns, ...), otherwise the pgxpool default shown here.
  max_conns: 10               # default max(4, number of CPUs); keep hosts × max_conns < server max_connections
  min_conns: 0                # connections kept open when idle (default 0)
  max_conn_lifetime: "1h"     # recycle a connection after this long (default 1h)
  max_conn_idle_time: "30m"   # close a connection idle this long (default 30m)

# Security Notes:
# - Never commit real credentials to version control
# - Use least-privilege database users
